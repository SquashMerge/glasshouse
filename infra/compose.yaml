name: astraea

services:
  postgres:
    image: postgres:16-alpine
    container_name: astraea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-astraea}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - astraea_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: astraea-clickhouse
    restart: unless-stopped
    platform: linux/amd64
    cap_add:
      - SYS_NICE
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-astraea}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - astraea_ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    container_name: astraea-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - /usr/local/etc/valkey/valkey.conf
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - ./infra/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - astraea_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: astraea-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: ${API_PORT:-3000}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-1048576}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-astraea}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-astraea}
      UI_USERNAME: ${UI_USERNAME:?UI_USERNAME must be set in infra/.env}
      UI_PASSWORD: ${UI_PASSWORD:?UI_PASSWORD must be set in infra/.env}
      ASTRAEA_BASIC_AUTH_CREDENTIALS: ${ASTRAEA_BASIC_AUTH_CREDENTIALS:-}
      ASTRAEA_REDACT_INPUT: ${ASTRAEA_REDACT_INPUT:-false}
      ASTRAEA_REDACT_KEYS: ${ASTRAEA_REDACT_KEYS:-}
      ASTRAEA_BOOTSTRAP_OWNER_USERNAME: ${ASTRAEA_BOOTSTRAP_OWNER_USERNAME:?ASTRAEA_BOOTSTRAP_OWNER_USERNAME must be set in infra/.env}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-astraea}
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}@valkey:6379
      EVALUATION_ALLOWED_MODELS: ${EVALUATION_ALLOWED_MODELS:-openai/gpt-4o-mini}
      EVALUATION_MAX_ACTIVE_RUNS_PER_PROJECT: ${EVALUATION_MAX_ACTIVE_RUNS_PER_PROJECT:-4}
      EVALUATION_MAX_ACTIVE_RUNS_PER_ACTOR: ${EVALUATION_MAX_ACTIVE_RUNS_PER_ACTOR:-2}
      EVALUATION_MAX_CASES_PER_RUN: ${EVALUATION_MAX_CASES_PER_RUN:-100}
      EVALUATION_MAX_PROVIDER_CALLS_PER_RUN: ${EVALUATION_MAX_PROVIDER_CALLS_PER_RUN:-100}
      GEPA_ALLOWED_MODELS: ${GEPA_ALLOWED_MODELS:?GEPA_ALLOWED_MODELS must list permitted GEPA models}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "$$GEPA_PYTHON /app/worker/gepa_worker.py --smoke >/dev/null && wget --spider --quiet http://localhost:3000/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: astraea-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: ${WEB_PORT:-5173}
      VITE_API_PROXY: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  astraea_pg_data:
    driver: local
  astraea_ch_data:
    driver: local
  astraea_valkey_data:
    driver: local
