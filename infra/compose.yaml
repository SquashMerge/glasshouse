name: glasshouse

services:
  postgres:
    image: postgres:16-alpine
    container_name: glasshouse-postgres
    restart: unless-stopped
    logging:
      driver: ${DOCKER_LOG_DRIVER:-local}
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-glasshouse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - glasshouse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: glasshouse-clickhouse
    restart: unless-stopped
    logging:
      driver: ${DOCKER_LOG_DRIVER:-local}
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    platform: linux/amd64
    cap_add:
      - SYS_NICE
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glasshouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - glasshouse_ch_data:/var/lib/clickhouse
      - ./infra/clickhouse/backup.xml:/etc/clickhouse-server/config.d/glasshouse-backup.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    container_name: glasshouse-valkey
    restart: unless-stopped
    logging:
      driver: ${DOCKER_LOG_DRIVER:-local}
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    command:
      - valkey-server
      - /usr/local/etc/valkey/valkey.conf
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - ./infra/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - glasshouse_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: glasshouse-api
    restart: unless-stopped
    logging:
      driver: ${DOCKER_LOG_DRIVER:-local}
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: ${API_PORT:-3000}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-1048576}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-glasshouse}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-glasshouse}
      UI_USERNAME: ${UI_USERNAME:?UI_USERNAME must be set in infra/.env}
      UI_PASSWORD: ${UI_PASSWORD:?UI_PASSWORD must be set in infra/.env}
      GLASSHOUSE_BASIC_AUTH_CREDENTIALS: ${GLASSHOUSE_BASIC_AUTH_CREDENTIALS:-}
      GLASSHOUSE_AUTH_BOOTSTRAP_MODE: ${GLASSHOUSE_AUTH_BOOTSTRAP_MODE:-basic}
      GLASSHOUSE_PUBLIC_ORIGIN: ${GLASSHOUSE_PUBLIC_ORIGIN:-}
      GLASSHOUSE_DEFAULT_ORGANIZATION_ID: ${GLASSHOUSE_DEFAULT_ORGANIZATION_ID:-00000000-0000-4000-8000-000000000001}
      GLASSHOUSE_REDACT_INPUT: ${GLASSHOUSE_REDACT_INPUT:-false}
      GLASSHOUSE_REDACT_KEYS: ${GLASSHOUSE_REDACT_KEYS:-}
      GLASSHOUSE_BOOTSTRAP_OWNER_USERNAME: ${GLASSHOUSE_BOOTSTRAP_OWNER_USERNAME:?GLASSHOUSE_BOOTSTRAP_OWNER_USERNAME must be set in infra/.env}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glasshouse}
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}@valkey:6379
      EVALUATION_ALLOWED_MODELS: ${EVALUATION_ALLOWED_MODELS:-openai/gpt-4o-mini}
      EVALUATION_MAX_ACTIVE_RUNS_PER_PROJECT: ${EVALUATION_MAX_ACTIVE_RUNS_PER_PROJECT:-4}
      EVALUATION_MAX_ACTIVE_RUNS_PER_ACTOR: ${EVALUATION_MAX_ACTIVE_RUNS_PER_ACTOR:-2}
      EVALUATION_MAX_REQUESTED_SAMPLE_SIZE_PER_RUN: ${EVALUATION_MAX_REQUESTED_SAMPLE_SIZE_PER_RUN:-100}
      EVALUATION_MAX_PROVIDER_CALLS_PER_RUN: ${EVALUATION_MAX_PROVIDER_CALLS_PER_RUN:-100}
      GLASSHOUSE_EVAL_LLM_PROVIDER: ${GLASSHOUSE_EVAL_LLM_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEPA_ALLOWED_MODELS: ${GEPA_ALLOWED_MODELS:?GEPA_ALLOWED_MODELS must list permitted GEPA models}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "$$GEPA_PYTHON /app/worker/gepa_worker.py --smoke >/dev/null && wget --spider --quiet http://localhost:3000/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: glasshouse-web
    restart: unless-stopped
    logging:
      driver: ${DOCKER_LOG_DRIVER:-local}
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: ${WEB_PORT:-5173}
      VITE_API_PROXY: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

# Preserve existing physical stores while the logical service names are Glasshouse.
volumes:
  glasshouse_pg_data:
    name: astraea_astraea_pg_data
    driver: local
  glasshouse_ch_data:
    name: astraea_astraea_ch_data
    driver: local
  glasshouse_valkey_data:
    name: astraea_astraea_valkey_data
    driver: local
