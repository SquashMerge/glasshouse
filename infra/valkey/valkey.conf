# Persistent runtime config (non-secret).
# The requirepass is passed via compose command (see infra/compose.yaml) so
# the actual password is never baked into this file.
#
# Valkey is the open-source fork of Redis maintained by the Linux Foundation;
# the wire protocol is identical to Redis 7.2+, so ioredis clients work
# unchanged. https://valkey.io

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Conservative dev defaults
maxmemory 256mb
maxmemory-policy allkeys-lru
tcp-keepalive 60
timeout 0
bind 0.0.0.0
port 6379