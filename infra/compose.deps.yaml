# infra/compose.deps.yaml
# Data services only (Postgres + ClickHouse + Valkey). Use this when running the
# api/web locally via bun (fast HMR): `make deps-up` then `make dev-backend`
# + `make dev-frontend` in separate terminals.
#
# Don't run `make dev` (full stack) at the same time as `make deps-up` — the
# ports collide.

name: glasshouse-deps

services:
  postgres:
    image: postgres:16-alpine
    container_name: glasshouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-glasshouse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - glasshouse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: glasshouse-clickhouse
    restart: unless-stopped
    platform: linux/amd64
    cap_add:
      - SYS_NICE
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-glasshouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set in infra/.env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set in infra/.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - glasshouse_ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --timeout=2 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: glasshouse-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - /usr/local/etc/valkey/valkey.conf
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - glasshouse_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in infra/.env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Preserve existing physical stores while the logical service names are Glasshouse.
volumes:
  glasshouse_pg_data:
    name: astraea-deps_astraea_pg_data
    driver: local
  glasshouse_ch_data:
    name: astraea-deps_astraea_ch_data
    driver: local
  glasshouse_valkey_data:
    name: astraea-deps_astraea_valkey_data
    driver: local