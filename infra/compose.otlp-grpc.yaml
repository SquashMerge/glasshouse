# Optional OTLP/gRPC listener for a TLS edge or a private host-only consumer.
# Use with infra/compose.production.yaml or deploy/snapshot/compose.yaml, never
# with an Internet-published port without an operator-managed TLS proxy.
services:
  api:
    environment:
      OTLP_GRPC_PORT: 4317
      # Docker resolves this service name to its private container address.
      OTLP_GRPC_HOST: api
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317"
