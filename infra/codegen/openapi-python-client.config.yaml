# openapi-python-client config
project_name_override: glasshouse-client
package_name_override: glasshouse_client
path: ../../openapi.yaml
custom_template_path: ~
meta: none
post_hooks:
  - "uvx ruff check --fix"
  - "uvx ruff format"
field_prefix: ""

# Stability knobs — keep these so re-runs produce byte-stable output
use_path_prefixes_for_title_model: false
do_not_use_title_to_override_module_name: true
literal_enums: false