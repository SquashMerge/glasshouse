services:
  api:
    ports: !reset []
  web:
    ports: !reset []
  proxy:
    image: nginx:1.27.5-alpine
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }
  probe:
    image: curlimages/curl:8.12.1
    profiles: [probe]
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }
