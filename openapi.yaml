  /v1/evaluations/{slug}/runs:
    post:
      description: Resolves an immutable Definition Version and Dataset Version snapshot before any work is queued. Admission accepts only an exact operator-allowed provider/model pair and snapshots active-run, requested sample-size, and provider-call bounds. Active limits are 1-32 per Project and actor; the requested sample-size and provider-call limits are 1-10,000 per Run. The sample-size limit is checked before Dataset items are materialized. Retries with the same Idempotency-Key replay the original run.
      parameters:
        - description: Canonical Evaluation slug. UUID Evaluation IDs are accepted only by read detail and inspection endpoints.
          in: path
          name: slug
          required: true
          schema:
            description: Canonical Evaluation slug. UUID Evaluation IDs are accepted only by read detail and inspection endpoints.
            example: support-quality-gate
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: idempotency-key
          required: true
          schema:
            maxLength: 200
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRunStart'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
          description: Run admitted and queued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unapproved provider/model pair, strict configuration validation, or requested sample-size/provider-call budget rejected before a runnable Run is persisted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Executable Evaluation Definition Version not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Run-start conflict, including an Idempotency-Key bound to a different immutable request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Active project or actor capacity is exhausted; no runnable Run is persisted
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
      security:
        - csrfHeader: []
          sessionCookie: []
        - basicAuth: []
      summary: Admit and start a reproducible Evaluation Run
      tags:
        - evaluations
