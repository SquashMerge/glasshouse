components:
  parameters: {}
  schemas:
    AdminActor:
      additionalProperties: false
      properties:
        actor_id:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        organization_role:
          enum:
            - admin
            - user
            - read_only
            - null
          type:
            - string
            - 'null'
        username:
          type:
            - string
            - 'null'
      required:
        - actor_id
        - username
        - organization_role
        - created_at
      type: object
    AdminAuditEvent:
      additionalProperties: false
      properties:
        action:
          minLength: 1
          type: string
        actor_id:
          format: uuid
          type: string
        correlation_id:
          format: uuid
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        organization_id:
          format: uuid
          type: string
        project_id:
          format: uuid
          type:
            - string
            - 'null'
        target_actor_id:
          format: uuid
          type:
            - string
            - 'null'
      required:
        - id
        - actor_id
        - target_actor_id
        - organization_id
        - project_id
        - action
        - correlation_id
        - created_at
      type: object
    AgentIntrospectionReportV1:
      additionalProperties: false
      properties:
        adapter:
          additionalProperties: false
          properties:
            framework:
              pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,199}$
              type: string
            framework_version:
              pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,199}$
              type:
                - string
                - 'null'
            name:
              pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,199}$
              type: string
            version:
              pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,199}$
              type: string
          required:
            - name
            - version
            - framework
            - framework_version
          type: object
        capabilities:
          items:
            additionalProperties: false
            properties:
              capability:
                enum:
                  - agent_lifecycle
                  - model_calls
                  - tool_calls
                  - workflows
                  - teams
                  - handoffs
                  - retries
                  - streaming
                  - trace_linkage
                  - content_references
                  - cost
                type: string
              reason:
                enum:
                  - framework_unsupported
                  - adapter_unsupported
                  - not_instrumented
                  - version_unknown
                  - unknown
                  - null
                type:
                  - string
                  - 'null'
              support:
                enum:
                  - supported
                  - unsupported
                  - unknown
                type: string
            required:
              - capability
              - support
              - reason
            type: object
          type: array
        capture:
          additionalProperties: false
          properties:
            content_mode:
              enum:
                - references_only
              type: string
            sampling:
              enum:
                - full
                - sampled
                - unknown
              type: string
            source:
              enum:
                - client_reported
              type: string
          required:
            - source
            - content_mode
            - sampling
          type: object
        completeness:
          enum:
            - complete
            - partial
            - unknown
          type: string
        contract_version:
          enum:
            - agent-introspection.v1
          type: string
        events:
          items:
            oneOf:
              - additionalProperties: false
                properties:
                  detail:
                    additionalProperties: false
                    properties:
                      agent_key:
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,199}$
                        type: string
                      version_fingerprint:
                        pattern: ^[a-f0-9]{64}$
                        type:
                          - string
                          - 'null'
                    required:
                      - agent_key
                      - version_fingerprint
                    type: object
                  event_id:
                    format: uuid
                    type: string
                  occurred_at:
                    format: date-time
                    type: string
                  operation_id:
                    format: uuid
                    type: string
                  parent_event_id:
                    format: uuid
                    type:
                      - string
                      - 'null'
                  references:
                    items:
                      additionalProperties: false
                      properties:
                        byte_count:
                          minimum: 0
                          type:
                            - integer
                            - 'null'
                        id:
                          maxLength: 256
                          minLength: 1
                          type: string
                        kind:
                          enum:
                            - input
                            - output
                            - prompt
                            - tool_arguments
                            - tool_result
                          type: string
                        redacted:
                          type: boolean
                        sha256:
                          pattern: ^[a-f0-9]{64}$
                          type:
                            - string
                            - 'null'
                        source:
                          enum:
                            - evaluation_run_item
                            - trace
                            - observation
                            - prompt_version
                            - content_digest
                          type: string
                      required:
                        - kind
                        - source
                        - id
                        - sha256
                        - byte_count
                        - redacted
                      type: object
                    maxItems: 8
                    type: array
                  sequence:
                    maximum: 255
