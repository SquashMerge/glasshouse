  /v1/prompt-optimizations:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                budget:
                  additionalProperties: false
                  properties:
                    max_metric_calls:
                      description: Must be at least the number of held-out validation examples.
                      maximum: 100
                      minimum: 2
                      type: integer
                  required:
                    - max_metric_calls
                  type: object
                dataset:
                  additionalProperties: false
                  properties:
                    rubric:
                      maxLength: 2000
                      minLength: 1
                      type: string
                    training_examples:
                      items:
                        additionalProperties: false
                        properties:
                          additional_context:
                            additionalProperties: {}
                            type: object
                          answer:
                            maxLength: 12000
                            minLength: 1
                            type: string
                          input:
                            maxLength: 12000
                            minLength: 1
                            type: string
                        required:
                          - input
                          - answer
                        type: object
                      maxItems: 25
                      minItems: 1
                      type: array
                    validation_examples:
                      items:
                        additionalProperties: false
                        properties:
                          additional_context:
                            additionalProperties: {}
                            type: object
                          answer:
                            maxLength: 12000
                            minLength: 1
                            type: string
                          input:
                            maxLength: 12000
                            minLength: 1
                            type: string
                        required:
                          - input
                          - answer
                        type: object
                      maxItems: 25
                      minItems: 1
                      type: array
                    version:
                      enum:
                        - 1
                      type: number
                  required:
                    - version
                    - rubric
                    - training_examples
                    - validation_examples
                  type: object
                evaluator:
                  additionalProperties: false
                  properties:
                    type:
                      enum:
                        - default_adapter
                      type: string
                  required:
                    - type
                  type: object
                model_config:
                  additionalProperties: false
                  properties:
                    reflection_lm:
                      minLength: 1
                      type: string
                    task_lm:
                      minLength: 1
                      type: string
                  required:
                    - task_lm
                    - reflection_lm
                  type: object
                project_id:
                  format: uuid
                  type: string
                slug:
                  example: support-agent
                  maxLength: 64
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  type: string
                source_version:
                  exclusiveMinimum: 0
                  type: integer
                target:
                  enum:
                    - system
                  type: string
              required:
                - project_id
                - slug
                - source_version
                - target
                - evaluator
                - dataset
                - model_config
                - budget
              type: object
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  budget:
                    additionalProperties: {}
                    type: object
                  candidate_content:
                    type:
                      - string
                      - 'null'
                  completed_at:
                    format: date-time
                    type:
                      - string
                      - 'null'
                  created_at:
                    format: date-time
                    type: string
                  dataset:
                    additionalProperties: false
                    properties:
                      rubric:
                        type: string
                      training_example_count:
                        minimum: 0
                        type: integer
                      validation_example_count:
                        minimum: 0
                        type: integer
                      version:
                        anyOf:
                          - enum:
                              - 0
                            type: number
                          - enum:
                              - 1
                            type: number
                    required:
                      - version
                      - rubric
                      - training_example_count
                      - validation_example_count
                    type: object
                  error_message:
                    type:
                      - string
                      - 'null'
                  evidence:
                    additionalProperties: false
                    properties:
