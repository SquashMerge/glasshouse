                            minimum: 0
                            type: integer
                          score:
                            type:
                              - number
                              - 'null'
                        required:
                          - sample_count
                          - score
                        type: object
                      validation:
                        additionalProperties: false
                        properties:
                          baseline_score:
                            type:
                              - number
                              - 'null'
