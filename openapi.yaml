        next_cursor:
          type: string
        response_truncated:
          type: boolean
        total:
          type: integer
      required:
        - items
        - total
      type: object
    TraceStatus:
      enum:
        - ok
        - error
      type: string
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http
    csrfHeader:
      in: header
      name: x-astraea-csrf
      type: apiKey
    sessionCookie:
      description: HttpOnly opaque local session; never read or store it in JavaScript. Cookie-authenticated mutations also require x-astraea-csrf from GET /v1/auth/session.
