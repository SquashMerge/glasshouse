          type: number
        - enum:
            - 1
          type: number
        - enum:
            - 2
          type: number
        - enum:
            - 3
          type: number
        - enum:
            - 4
          type: number
        - enum:
            - 5
          type: number
    SpanStatus:
      properties:
        code:
          anyOf:
            - enum:
                - 0
              type: number
            - enum:
                - 1
              type: number
            - enum:
                - 2
              type: number
        message:
          type: string
      type: object
    StoredAgentIntrospectionReportV1:
      additionalProperties: false
      properties:
        completeness:
          enum:
            - complete
            - partial
            - unknown
          type: string
        contract_version:
          enum:
            - agent-introspection.v1
          type: string
        evaluation_run_id:
          format: uuid
          type: string
        evaluation_run_item_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        invocation_id:
          format: uuid
          type: string
        organization_id:
          format: uuid
          type: string
        outcome:
          enum:
            - succeeded
            - failed
            - cancelled
            - unknown
          type: string
        project_id:
          format: uuid
          type: string
        received_at:
          format: date-time
          type: string
        replayed:
          type: boolean
        report:
          $ref: '#/components/schemas/AgentIntrospectionReportV1'
        reported_by_actor_id:
          format: uuid
          type: string
        request_hash:
          pattern: ^[a-f0-9]{64}$
          type: string
        source:
          enum:
            - client_reported
          type: string
        task_id:
          format: uuid
          type: string
      required:
        - id
        - organization_id
        - project_id
        - evaluation_run_id
        - evaluation_run_item_id
        - task_id
        - invocation_id
        - reported_by_actor_id
        - source
        - contract_version
        - request_hash
        - outcome
        - completeness
        - received_at
        - report
        - replayed
      type: object
    Trace:
      properties:
        agent_id:
          default: ''
          type: string
        agent_version:
          default: ''
          type: string
        duration_ms:
          type:
            - integer
            - 'null'
        end_time:
          format: date-time
          type:
            - string
            - 'null'
        env:
          type: string
        input_excerpt_truncated:
          type: boolean
        input_retained_truncated:
          type: boolean
        input_text:
          default: ''
          type: string
        name:
          type: string
        output_excerpt_truncated:
          type: boolean
        output_retained_truncated:
          type: boolean
        output_text:
          default: ''
          type: string
        project_id:
          type: string
        session_id:
          default: ''
          type: string
        start_time:
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/TraceStatus'
        tags:
          default: []
          items:
            type: string
          type: array
        trace_id:
          type: string
        user_id:
          default: ''
          type: string
      required:
        - trace_id
        - project_id
        - name
        - start_time
        - status
        - env
      type: object
    TraceList:
      properties:
        items:
          items:
