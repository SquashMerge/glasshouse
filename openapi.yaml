          schema:
            example: support-agent
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptVersionCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptVersion'
          description: Version created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal error
      security:
        - csrfHeader: []
          sessionCookie: []
        - basicAuth: []
      summary: Create the next immutable prompt version
      tags:
        - prompts
  /v1/prompts/{id}/versions/rollback:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            example: support-agent
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
          description: Previous version restored
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal error
      security:
        - csrfHeader: []
          sessionCookie: []
        - basicAuth: []
      summary: Permanently remove the latest prompt version and restore the previous version
      tags:
        - prompts
  /v1/traces:
    get:
      description: Returns a project-scoped page sorted by start_time DESC, trace_id DESC. limit defaults to 50, accepts zero, and clamps values above 200; malformed, fractional, or negative limits return 400. v1 offset pagination remains supported; use the opaque next_cursor keyset continuation for new clients and do not combine it with a positive offset. The raw UTF-8 JSON body is capped at 256 KiB; a byte-truncated page carries response_truncated and next_cursor. Input and output excerpts are limited to 200 Unicode code points; the retained and excerpt truncation flags distinguish storage clipping from list presentation.
      parameters:
        - description: Default 50. Zero is allowed. Values above 200 are clamped to 200; malformed, fractional, or negative values return 400.
          in: query
          name: limit
          required: false
          schema:
            example: 50
            minLength: 1
            type: string
        - description: v1 offset pagination. Defaults to 0. A malformed, fractional, negative, or offset above 2147483647 returns 400.
          in: query
          name: offset
          required: false
          schema:
            example: 0
            minLength: 1
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
        - description: Opaque, project-scoped keyset cursor from next_cursor. Do not combine it with a positive v1 offset.
          in: query
          name: cursor
          required: false
          schema:
            maxLength: 2048
            minLength: 1
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceList'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid pagination parameters
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Trace not found
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A response cannot fit within the raw UTF-8 byte limit
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'
          description: Not implemented
      security:
        - sessionCookie: []
        - basicAuth: []
      summary: List traces
      tags:
        - traces
  /v1/traces/events:
    get:
      description: 'Subscribes to the `trace.created` bus event and emits one `event: trace` SSE frame per published trace. Its trace payload uses the Trace list projection: no organization_id, input/output excerpts limited to 200 Unicode code points, and retained/excerpt truncation flags. Sends an `:ok` comment immediately on connect, a `:heartbeat` comment every `SSE_HEARTBEAT_MS` (default 15s), and cleans up the bus subscription on client disconnect.'
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE stream of events
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad request
      security:
        - sessionCookie: []
        - basicAuth: []
      summary: SSE stream of newly created traces
      tags:
        - traces
  /v1/traces/{id}:
    get:
      description: Fetch a project- and trace-scoped observation page in stable start_time, observation_id order. The embedded trace input/output remain 200-Unicode-code-point excerpts; each observation detail field contains the full retained value, capped at 8 KiB UTF-8, and truncation flags report source or legacy read-time clipping. The raw UTF-8 JSON body is capped at 256 KiB; response_truncated and a project- and trace-scoped next_cursor preserve byte-truncated continuation. Legacy metadata arrays are exposed as attributes with null prompt provenance, while invalid or oversized persisted metadata fails closed.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            example: 0123456789abcdef0123456789abcdef
            pattern: ^[0-9a-f]{32}$
            type: string
        - in: query
          name: expand
          required: false
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
        - description: Opaque, project- and trace-scoped keyset cursor from next_cursor.
          in: query
          name: cursor
          required: false
          schema:
            maxLength: 2048
            minLength: 1
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  next_cursor:
                    type: string
                  observations:
                    items:
                      $ref: '#/components/schemas/Observation'
                    type: array
                  response_truncated:
                    type: boolean
                  trace:
                    $ref: '#/components/schemas/Trace'
                required:
                  - trace
                  - observations
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or invalid project_id
        '404':
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                  message:
                    type: string
                type: object
          description: Trace not found
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A response cannot fit within the raw UTF-8 byte limit
      security:
        - sessionCookie: []
        - basicAuth: []
      summary: Get a trace
      tags:
        - traces
  /v1/traces/{id}/events:
    get:
      description: |-
        Validates the trace exists (404 short-circuits BEFORE the SSE upgrade), subscribes to `observation.created` BEFORE writing the snapshot (so any observation created in the gap is delivered as a live event), writes an `event: snapshot` frame with existing observations capped by the raw UTF-8 event/data SSE frame budget (the smaller of 256 KiB and `SSE_MAX_PENDING_BYTES`); a partial snapshot has `snapshot_truncated: true` and a project- and trace-scoped `next_cursor`, then forwards matching observations (`observation.trace_id === id` and matching project provenance) as `event: observation` frames. Each matching observation resets a `TRACE_COMPLETE_GRACE_MS` default-30s timer; on the timer's fire the server writes `event: status
        data: {"status":"complete"}` and closes the stream.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            example: 0123456789abcdef0123456789abcdef
            pattern: ^[0-9a-f]{32}$
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE stream of events
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Trace not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Trace snapshot query failed before the SSE upgrade; retry safely.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Trace snapshot buffering reached its bounded limit before the SSE upgrade; retry safely.
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Trace snapshot did not complete before its bounded delivery deadline; retry safely.
      security:
        - sessionCookie: []
        - basicAuth: []
      summary: 'SSE stream for a single trace: snapshot + live observations + complete'
      tags:
        - traces
servers:
  - description: Local dev
    url: http://localhost:3000
webhooks: {}
