  /v1/observations:
    get:
      description: Returns a project-scoped page sorted by start_time DESC, observation_id DESC. limit defaults to 50, accepts zero, and clamps values above 200; malformed, fractional, or negative limits return 400. v1 offset pagination remains supported; use the opaque next_cursor keyset continuation for new clients and do not combine it with a positive offset. The raw UTF-8 JSON body is capped at 256 KiB; a byte-truncated page carries response_truncated and next_cursor. Input and output excerpts are limited to 200 Unicode code points; the retained and excerpt truncation flags distinguish storage clipping from list presentation.
      parameters:
        - description: Default 50. Zero is allowed. Values above 200 are clamped to 200; malformed, fractional, or negative values return 400.
          in: query
          name: limit
          required: false
          schema:
            example: 50
            minLength: 1
            type: string
        - description: v1 offset pagination. Defaults to 0. A malformed, fractional, negative, or offset above 2147483647 returns 400.
          in: query
          name: offset
          required: false
          schema:
            example: 0
            minLength: 1
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
        - description: Opaque, project-scoped keyset cursor from next_cursor. Do not combine it with a positive v1 offset.
          in: query
          name: cursor
          required: false
          schema:
            maxLength: 2048
            minLength: 1
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationList'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid pagination parameters
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Trace not found
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: A response cannot fit within the raw UTF-8 byte limit
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'
          description: Not implemented
      security:
        - sessionCookie: []
        - basicAuth: []
      summary: List observations (spans)
      tags:
        - traces
  /v1/observations/events:
    get:
      description: 'Subscribes to the `observation.created` bus event and emits one `event: observation` SSE frame per published observation, with the Observation list projection: no organization_id, 200-Unicode-code-point input/output excerpts with retained/excerpt truncation flags, and a 2 KiB metadata envelope with metadata_truncated when omitted. It includes a typed versioned metadata envelope and nullable prompt provenance. Sends an `:ok` comment immediately on connect and a `:heartbeat` comment every `SSE_HEARTBEAT_MS` (default 15s).'
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE stream of events
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad request
      security:
        - sessionCookie: []
        - basicAuth: []
      summary: SSE stream of newly created observations
      tags:
        - traces
