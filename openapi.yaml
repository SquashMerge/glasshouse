              type: string
            version:
              type: string
          type: object
        spans:
          items:
            $ref: '#/components/schemas/Span'
          maxItems: 512
          minItems: 1
          type: array
      required:
        - spans
      type: object
    Span:
      properties:
        attributes:
          default: []
          items:
            $ref: '#/components/schemas/KeyValue'
          maxItems: 128
          type: array
        end_time_unix_nano:
          anyOf:
            - type: number
            - type: string
        events:
          items: {}
          maxItems: 128
          type: array
        kind:
          $ref: '#/components/schemas/SpanKind'
        links:
          items: {}
          maxItems: 128
          type: array
        name:
          maxLength: 256
          minLength: 1
          type: string
        parent_span_id:
          pattern: ^[0-9a-f]{16}$
          type:
            - string
            - 'null'
        span_id:
          pattern: ^[0-9a-f]{16}$
          type: string
        start_time_unix_nano:
          anyOf:
            - type: number
            - type: string
        status:
          $ref: '#/components/schemas/SpanStatus'
