services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: otlp_test
      POSTGRES_PASSWORD: otlp-test-password
      POSTGRES_DB: glasshouse
    volumes: [pg_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otlp_test -d glasshouse"]
      interval: 2s
      timeout: 2s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.2.103-alpine
    platform: linux/amd64
    environment:
      CLICKHOUSE_DB: glasshouse
      CLICKHOUSE_USER: otlp_test
      CLICKHOUSE_PASSWORD: otlp-test-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./infra/clickhouse/backup.xml:/etc/clickhouse-server/config.d/glasshouse-backup.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 45
  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--requirepass", "otlp-test-password"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "otlp-test-password", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  otlp-tests:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: build }
    command: ["sleep", "infinity"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgres://otlp_test:otlp-test-password@postgres:5432/glasshouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: otlp_test
      POSTGRES_PASSWORD: otlp-test-password
      POSTGRES_DB: glasshouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: otlp_test
      CLICKHOUSE_PASSWORD: otlp-test-password
      CLICKHOUSE_DB: glasshouse
      VALKEY_URL: redis://:otlp-test-password@valkey:6379
      UI_USERNAME: otlp-sdk
      UI_PASSWORD: otlp-sdk-password
      GLASSHOUSE_BOOTSTRAP_OWNER_USERNAME: otlp-sdk
      GEPA_ALLOWED_MODELS: openai/gpt-4o-mini
      OTLP_GRPC_PORT: 4317
      OTLP_GRPC_HOST: api
    ports: ["127.0.0.1::3000", "127.0.0.1::4317"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pg_data:
  ch_data:
