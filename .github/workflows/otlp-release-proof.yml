name: OTLP release image proof (non-publishing)

on:
  push:
    branches: [integration/otlp-release-proof-20261104-225913]

permissions:
  contents: read

jobs:
  proof:
    name: Reloaded release image and extracted gRPC overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact proof commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Exercise official exporter against reloaded standalone image
        run: bash infra/scripts/test-otlp-sdk-integration.sh --release-candidate
