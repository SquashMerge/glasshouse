name: Protected tag release publisher

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: glasshouse-release-publisher
  cancel-in-progress: false

jobs:
  build-and-test:
    if: >-
      github.repository == 'SquashMerge/glasshouse' &&
      github.event_name == 'push' && !github.event.deleted &&
      vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      manifest_sha: ${{ steps.evidence.outputs.manifest_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test publisher safety contracts
        run: python3 -m unittest discover -s infra/scripts/tests -p test_release_publisher.py -v
      - name: Admit protected tag and exact main checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/scripts/release-publisher.py admit
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install browser dependencies
        run: |
          bun install --frozen-lockfile
          (cd apps/web && bunx --no-install playwright install --with-deps chromium)
      - name: Install pinned scanner
        run: python3 scripts/install_snapshot_trivy.py
      - name: Build and test exact release archives
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: bash infra/scripts/test-publisher-candidate.sh
      - name: Bind the tested checksums
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum --check SHA256SUMS
          printf 'manifest_sha=%s\n' "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Transfer tested archives
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/glasshouse-image.tar.gz
            ${{ runner.temp }}/glasshouse-bundle.tar.gz
            ${{ runner.temp }}/candidate-sbom.json
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-draft:
    needs: build-and-test
    if: >-
      github.repository == 'SquashMerge/glasshouse' &&
      github.event_name == 'push' && !github.event.deleted &&
      vars.RELEASE_PUBLISH_ENABLED == 'true'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact reviewed tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact tested artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build-and-test.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-assets
      - name: Verify transferred artifact and repeat admission
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST: ${{ needs.build-and-test.outputs.manifest_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$RUNNER_TEMP/release-assets/SHA256SUMS" | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check SHA256SUMS)
          python3 infra/scripts/release-publisher.py admit
      - name: Attest exact tested archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/glasshouse-image.tar.gz
            ${{ runner.temp }}/release-assets/glasshouse-bundle.tar.gz
            ${{ runner.temp }}/release-assets/candidate-sbom.json
          push-to-registry: false
      - name: Create and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST: ${{ needs.build-and-test.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$RUNNER_TEMP/release-assets/SHA256SUMS" | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check SHA256SUMS)
          python3 infra/scripts/release-publisher.py publish --asset-dir "$RUNNER_TEMP/release-assets"
