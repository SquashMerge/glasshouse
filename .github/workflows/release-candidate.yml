name: Release candidate (non-publishing)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Bun for browser probe
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install browser dependencies
        run: |
          bun install --frozen-lockfile
          (cd apps/web && bunx --no-install playwright install --with-deps chromium)
      - name: Install checksum-pinned image scanner
        run: python3 scripts/install_snapshot_trivy.py
      - name: Build and test exact release archives without publishing
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: v0.0.0-rc.1
        run: bash infra/scripts/test-publisher-candidate.sh
