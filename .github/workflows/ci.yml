name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: bun run lint
          - check: format
            command: bun run format:check
          - check: typecheck
            command: bun run typecheck
          - check: test
            command: bun run test
          - check: build
            command: bun run build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan dependencies and tracked files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: cd apps/web && bunx --no-install playwright install --with-deps chromium

      - name: Configure deterministic CI environment
        run: |
          cp infra/.env.example infra/.env
          sed -i 's/CHANGE_ME/astraea-ci-password/g' infra/.env

      - name: Start application stack
        run: docker compose --env-file infra/.env -f infra/compose.yaml up --build --detach --wait --wait-timeout 180

      - name: Apply ClickHouse schema
        run: make ch-schema

      - name: Seed E2E project
        run: docker compose --env-file infra/.env -f infra/compose.yaml exec -T postgres psql -U astraea -d astraea -c "INSERT INTO projects (id, name, slug, organization_id) VALUES ('00000000-0000-4000-8000-000000000001', 'E2E Project', 'e2e-project', '00000000-0000-4000-8000-000000000001');"

      - name: Run Playwright E2E suite
        env:
          PLAYWRIGHT_E2E: "true"
          UI_USERNAME: astraea
          UI_PASSWORD: astraea-ci-password
        run: cd apps/web && bun run test:e2e

      - name: Dump application diagnostics
        if: failure()
        run: |
          docker compose --env-file infra/.env -f infra/compose.yaml ps
          docker compose --env-file infra/.env -f infra/compose.yaml logs --no-color --tail=200

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn

      - name: Stop application stack
        if: always()
        run: docker compose --env-file infra/.env -f infra/compose.yaml down --volumes --remove-orphans
