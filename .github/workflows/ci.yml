name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: bun run lint
          - check: format
            command: bun run format:check
          - check: typecheck
            command: bun run typecheck
          - check: test
            command: bun run test
          - check: supply-chain
            command: bun run test:supply-chain
          - check: worker-test
            command: python3 -m pip install --user --disable-pip-version-check --require-hashes -r worker/requirements.lock && python3 -m unittest worker.test_dev_cli_llm
          - check: build
            command: bun run build
          - check: openapi-artifact
            command: bun run openapi:check && bun --filter @glasshouse/api codegen:ts
          - check: compose-paths
            command: bash infra/scripts/test-compose-paths.sh
          - check: backup-restore-safety
            command: bash infra/scripts/test-backup-restore.sh
          - check: doctor-version
            command: bash infra/scripts/test-doctor-version.sh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Python for worker tests
        if: matrix.check == 'worker-test'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  backup-restore-integration:
    name: Backup/restore integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_SOURCE_COMPOSE_FILE: .github/compose.backup-restore.yaml
      BACKUP_SOURCE_ENV_FILE: ${{ github.workspace }}/.ci-backup-restore/source.env
      BACKUP_SOURCE_COMPOSE_PROJECT: backup-restore-source-${{ github.run_id }}-${{ github.run_attempt }}
      BACKUP_SOURCE_ID: ci-source
      BACKUP_RESTORE_DESTINATION: ${{ github.workspace }}/.ci-backup-restore/artifacts
      BACKUP_POSTGRES_SERVICE: postgres
      BACKUP_CLICKHOUSE_SERVICE: clickhouse
      RESTORE_TARGET_ID: ci-restore-${{ github.run_id }}-${{ github.run_attempt }}
      RESTORE_CONFIRMATION: RESTORE GLASSHOUSE TO ci-restore-${{ github.run_id }}-${{ github.run_attempt }}
      RESTORE_TARGET_LIVE: "false"
      RESTORE_TARGET_DIRECTORY: ${{ github.workspace }}/.ci-backup-restore/target
      RESTORE_TARGET_COMPOSE_FILE: ${{ github.workspace }}/.github/compose.backup-restore.yaml
      RESTORE_TARGET_ENV_FILE: ${{ github.workspace }}/.ci-backup-restore/target.env
      RESTORE_TARGET_COMPOSE_PROJECT: backup-restore-target-${{ github.run_id }}-${{ github.run_attempt }}
      RESTORE_POSTGRES_SERVICE: postgres
      RESTORE_CLICKHOUSE_SERVICE: clickhouse
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare isolated source and target environments
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RESTORE_TARGET_DIRECTORY/infra/clickhouse"
          cp "$GITHUB_WORKSPACE/infra/clickhouse/backup.xml" "$RESTORE_TARGET_DIRECTORY/infra/clickhouse/backup.xml"
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path

          paths = (
              Path(os.environ["BACKUP_SOURCE_ENV_FILE"]),
              Path(os.environ["RESTORE_TARGET_ENV_FILE"]),
          )
          for path in paths:
              postgres_password = secrets.token_hex(24)
              clickhouse_password = secrets.token_hex(24)
              contents = "\n".join((
                  "POSTGRES_USER=glasshouse_ci",
                  f"POSTGRES_PASSWORD={postgres_password}",
                  "POSTGRES_DB=glasshouse",
                  "CLICKHOUSE_USER=glasshouse_ci",
                  f"CLICKHOUSE_PASSWORD={clickhouse_password}",
                  "CLICKHOUSE_DB=glasshouse",
                  "",
              ))
              path.write_text(contents)
              path.chmod(0o600)
              print(f"::add-mask::{postgres_password}")
              print(f"::add-mask::{clickhouse_password}")
          PY
      - name: Start isolated source databases
        run: >-
          docker compose --project-directory "$GITHUB_WORKSPACE"
          --env-file "$BACKUP_SOURCE_ENV_FILE"
          --project-name "$BACKUP_SOURCE_COMPOSE_PROJECT"
          -f "$GITHUB_WORKSPACE/$BACKUP_SOURCE_COMPOSE_FILE"
          up --detach --wait --wait-timeout 180 postgres clickhouse
      - name: Start isolated empty restore target
        run: >-
          docker compose --project-directory "$RESTORE_TARGET_DIRECTORY"
          --env-file "$RESTORE_TARGET_ENV_FILE"
          --project-name "$RESTORE_TARGET_COMPOSE_PROJECT"
          -f "$RESTORE_TARGET_COMPOSE_FILE"
          up --detach --wait --wait-timeout 180 postgres clickhouse
      - name: Back up, restore, and verify representative rows
        run: bash infra/scripts/test-backup-restore-integration.sh
      - name: Stop isolated database projects
        if: always()
        run: |
          docker compose --project-directory "$GITHUB_WORKSPACE" \
            --env-file "$BACKUP_SOURCE_ENV_FILE" \
            --project-name "$BACKUP_SOURCE_COMPOSE_PROJECT" \
            -f "$GITHUB_WORKSPACE/$BACKUP_SOURCE_COMPOSE_FILE" \
            down --volumes --remove-orphans || true
          docker compose --project-directory "$RESTORE_TARGET_DIRECTORY" \
            --env-file "$RESTORE_TARGET_ENV_FILE" \
            --project-name "$RESTORE_TARGET_COMPOSE_PROJECT" \
            -f "$RESTORE_TARGET_COMPOSE_FILE" \
            down --volumes --remove-orphans || true
          rm -f "$BACKUP_SOURCE_ENV_FILE" "$RESTORE_TARGET_ENV_FILE"
          rm -rf "$BACKUP_RESTORE_DESTINATION" "$RESTORE_TARGET_DIRECTORY"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan dependencies and tracked files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  clickhouse:
    name: ClickHouse schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glasshouse
          POSTGRES_PASSWORD: glasshouse-ci-password
          POSTGRES_DB: glasshouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glasshouse -d glasshouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24-alpine
        env:
          CLICKHOUSE_DB: glasshouse
          CLICKHOUSE_USER: glasshouse
          CLICKHOUSE_PASSWORD: glasshouse-ci-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply ClickHouse migrations concurrently
        env:
          DATABASE_URL: postgres://glasshouse:glasshouse-ci-password@localhost:5432/glasshouse
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: glasshouse
          CLICKHOUSE_PASSWORD: glasshouse-ci-password
          CLICKHOUSE_DB: glasshouse
        run: |
          bun --filter @glasshouse/api ch:migrate &
          first=$!
          bun --filter @glasshouse/api ch:migrate &
          second=$!
          wait "$first"
          wait "$second"
          expected="$(find infra/db/clickhouse -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual="$(curl --fail --silent --show-error --user glasshouse:glasshouse-ci-password --data-binary 'SELECT count() FROM glasshouse_schema_migrations FORMAT TabSeparated' 'http://localhost:8123/?database=glasshouse')"
          test "$actual" = "$expected"

      - name: Verify ClickHouse schema
        env:
          DATABASE_URL: postgres://glasshouse:glasshouse-ci-password@localhost:5432/glasshouse
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: glasshouse
          CLICKHOUSE_PASSWORD: glasshouse-ci-password
          CLICKHOUSE_DB: glasshouse
        run: bun --filter @glasshouse/api test:clickhouse

  postgres-migrations:
    name: PostgreSQL migration upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify legacy PostgreSQL upgrade migrations
        run: bash infra/scripts/test-db-migrations.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GLASSHOUSE_AUTH_BOOTSTRAP_MODE: local
      GLASSHOUSE_PUBLIC_ORIGIN: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: cd apps/web && bunx --no-install playwright install --with-deps chromium

      - name: Configure deterministic CI environment
        run: |
          cp infra/.env.example infra/.env
          sed -i 's/CHANGE_ME/glasshouse-ci-password/g' infra/.env
          printf '\nGLASSHOUSE_EVAL_LLM_PROVIDER=fake\nOPENAI_MODEL=deterministic\nEVALUATION_ALLOWED_MODELS=fake/deterministic\n' >> infra/.env

      - name: Start application stack
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml up --build --detach --wait --wait-timeout 180

      - name: Verify startup migrations are complete after application boot and restart
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml)
          expected_postgres="$(find infra/db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          expected_clickhouse="$(find infra/db/clickhouse -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"

          verify_migrations() {
            actual_postgres="$("${compose[@]}" exec -T postgres psql -U glasshouse -d glasshouse -Atqc 'SELECT count(*) FROM pgmigrations')"
            actual_clickhouse="$("${compose[@]}" exec -T clickhouse clickhouse-client --user glasshouse --password glasshouse-ci-password --database glasshouse --query 'SELECT count() FROM glasshouse_schema_migrations')"
            test "$actual_postgres" = "$expected_postgres"
            test "$actual_clickhouse" = "$expected_clickhouse"
          }

          verify_migrations
          "${compose[@]}" restart api
          "${compose[@]}" up --detach --no-deps --wait --wait-timeout 180 api
          verify_migrations

      - name: Verify project mutation SQL against PostgreSQL
        run: |
          bash infra/scripts/with-local-env.sh bash -c '
            export DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-glasshouse}"
            bun --cwd apps/api test tests/integration/project-mutation-sql.test.ts
          '

      - name: Verify idempotent ClickHouse migrations
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml run --build --no-deps --rm --entrypoint sh api -c 'cd apps/api && bun run ch:migrate'

      - name: Generate masked test-only local credentials
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path
          token = secrets.token_urlsafe(32)
          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{token}")
          print(f"::add-mask::{password}")
          Path(os.environ["RUNNER_TEMP"], "e2e-bootstrap.token").write_text(token)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"E2E_LOCAL_USERNAME=e2e-local-admin\nE2E_LOCAL_PASSWORD={password}\n")
          PY

      - name: Provision test-only local Admin through operator bootstrap and setup
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml)
          trap 'rm -f "$RUNNER_TEMP/e2e-bootstrap.token"; "${compose[@]}" exec -T api rm -f /tmp/e2e-bootstrap.token' EXIT
          "${compose[@]}" cp "$RUNNER_TEMP/e2e-bootstrap.token" api:/tmp/e2e-bootstrap.token
          # Docker copies as root; the API runs as bun and must also clean up the private token file.
          "${compose[@]}" exec -T -u root api sh -c 'chown bun /tmp/e2e-bootstrap.token && chmod 600 /tmp/e2e-bootstrap.token'
          "${compose[@]}" exec -T -e GLASSHOUSE_LOCAL_BOOTSTRAP_TOKEN_FILE=/tmp/e2e-bootstrap.token api bun run --cwd apps/api auth:provision-bootstrap
          GLASSHOUSE_LOCAL_BOOTSTRAP_TOKEN_FILE="$RUNNER_TEMP/e2e-bootstrap.token" \
            bun run infra/scripts/setup-e2e-local-auth.ts
          "${compose[@]}" exec -T -e GLASSHOUSE_AUTH_BOOTSTRAP_MODE=basic api bun run --cwd apps/api src/db/bootstrap-authorization.ts

      - name: Seed E2E projects and memberships
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml exec -T postgres psql -U glasshouse -d glasshouse -c "INSERT INTO projects (id, name, slug, organization_id) VALUES ('00000000-0000-4000-8000-000000000001', 'E2E Project', 'e2e-project', '00000000-0000-4000-8000-000000000001'), ('00000000-0000-4000-8000-000000000002', 'E2E Other Project', 'e2e-other-project', '00000000-0000-4000-8000-000000000001') ON CONFLICT DO NOTHING; INSERT INTO project_memberships (project_id, organization_id, actor_subject, role) SELECT id, organization_id, 'glasshouse', 'manager' FROM projects WHERE id IN ('00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002') ON CONFLICT (project_id, actor_subject) DO UPDATE SET role = EXCLUDED.role, updated_at = now();"

      - name: Run Playwright E2E suite
        env:
          PLAYWRIGHT_E2E: "true"
          UI_USERNAME: glasshouse
          UI_PASSWORD: glasshouse-ci-password
        run: cd apps/web && bun run test:e2e

      - name: Dump application diagnostics
        if: failure()
        run: |
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml ps
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml logs --no-color --tail=200

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn

      - name: Stop application stack
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/e2e-bootstrap.token"
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml down --volumes --remove-orphans

  local-onboarding:
    name: Local first-run browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GLASSHOUSE_AUTH_BOOTSTRAP_MODE: local
      GLASSHOUSE_PUBLIC_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://glasshouse:glasshouse-ci-password@localhost:5432/glasshouse
      UI_USERNAME: e2e-onboarding-admin
      GLASSHOUSE_BOOTSTRAP_OWNER_USERNAME: e2e-onboarding-admin
      E2E_SETUP_SECRET_FILE: /tmp/glasshouse-ci-setup-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: bunx --no-install playwright install --with-deps chromium
      - name: Configure isolated CI stack
        run: |
          cp infra/.env.example infra/.env
          sed -i 's/CHANGE_ME/glasshouse-ci-password/g' infra/.env
      - name: Start fresh local-first application
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml up --build --detach --wait --wait-timeout 180
      - name: Generate masked independent local password
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import secrets
          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"UI_PASSWORD={password}\n")
          PY
      - name: Provision operator setup fixture without logging it
        run: bun run infra/scripts/prepare-local-auth-e2e.ts
      - name: Run first-run and manual-enrollment browser journey
        env:
          PLAYWRIGHT_LOCAL_ONBOARDING: "true"
        run: bun run --cwd apps/web test:e2e
      - name: Verify setup remains closed after process restart
        run: |
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml restart api
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml up --detach --no-deps --wait --wait-timeout 180 api
          curl --fail --silent http://localhost:5173/v1/auth/setup | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"available": False}'
      - name: Stop stack and remove setup fixture
        if: always()
        run: |
          rm -f "$E2E_SETUP_SECRET_FILE"
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml down --volumes --remove-orphans
