name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: bun run lint
          - check: format
            command: bun run format:check
          - check: typecheck
            command: bun run typecheck
          - check: test
            command: bun run test
          - check: worker-test
            command: python3 -m pip install --user --disable-pip-version-check --require-hashes -r worker/requirements.lock && python3 -m unittest worker.test_dev_cli_llm
          - check: build
            command: bun run build
          - check: compose-paths
            command: bash infra/scripts/test-compose-paths.sh
          - check: doctor-version
            command: bash infra/scripts/test-doctor-version.sh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan dependencies and tracked files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  clickhouse:
    name: ClickHouse schema
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24-alpine
        env:
          CLICKHOUSE_DB: astraea
          CLICKHOUSE_USER: astraea
          CLICKHOUSE_PASSWORD: astraea-ci-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply ClickHouse migrations twice
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: astraea
          CLICKHOUSE_PASSWORD: astraea-ci-password
          CLICKHOUSE_DB: astraea
        run: |
          bun --filter @astraea/api ch:migrate
          bun --filter @astraea/api ch:migrate

      - name: Verify ClickHouse schema
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: astraea
          CLICKHOUSE_PASSWORD: astraea-ci-password
          CLICKHOUSE_DB: astraea
        run: bun --filter @astraea/api test:clickhouse

  postgres-migrations:
    name: PostgreSQL migration upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify legacy PostgreSQL upgrade migrations
        run: bash infra/scripts/test-db-migrations.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: cd apps/web && bunx --no-install playwright install --with-deps chromium

      - name: Configure deterministic CI environment
        run: |
          cp infra/.env.example infra/.env
          sed -i 's/CHANGE_ME/astraea-ci-password/g' infra/.env

      - name: Start application stack
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml up --build --detach --wait --wait-timeout 180

      - name: Verify startup migrations are complete after application boot and restart
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml)
          expected_postgres="$(find infra/db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          expected_clickhouse="$(find infra/db/clickhouse -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"

          verify_migrations() {
            actual_postgres="$("${compose[@]}" exec -T postgres psql -U astraea -d astraea -Atqc 'SELECT count(*) FROM pgmigrations')"
            actual_clickhouse="$("${compose[@]}" exec -T clickhouse clickhouse-client --user astraea --password astraea-ci-password --database astraea --query 'SELECT count() FROM astraea_schema_migrations')"
            test "$actual_postgres" = "$expected_postgres"
            test "$actual_clickhouse" = "$expected_clickhouse"
          }

          verify_migrations
          "${compose[@]}" restart api
          "${compose[@]}" up --detach --no-deps --wait --wait-timeout 180 api
          verify_migrations

      - name: Verify idempotent ClickHouse migrations
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml run --build --no-deps --rm --entrypoint sh api -c 'cd apps/api && bun run ch:migrate'

      - name: Seed E2E projects and memberships
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml exec -T postgres psql -U astraea -d astraea -c "INSERT INTO projects (id, name, slug, organization_id) VALUES ('00000000-0000-4000-8000-000000000001', 'E2E Project', 'e2e-project', '00000000-0000-4000-8000-000000000001'), ('00000000-0000-4000-8000-000000000002', 'E2E Other Project', 'e2e-other-project', '00000000-0000-4000-8000-000000000001') ON CONFLICT DO NOTHING; INSERT INTO project_memberships (project_id, organization_id, actor_subject, role) SELECT id, organization_id, 'astraea', 'manager' FROM projects WHERE id IN ('00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002') ON CONFLICT (project_id, actor_subject) DO UPDATE SET role = EXCLUDED.role, updated_at = now();"

      - name: Run Playwright E2E suite
        env:
          PLAYWRIGHT_E2E: "true"
          UI_USERNAME: astraea
          UI_PASSWORD: astraea-ci-password
        run: cd apps/web && bun run test:e2e

      - name: Dump application diagnostics
        if: failure()
        run: |
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml ps
          docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml logs --no-color --tail=200

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn

      - name: Stop application stack
        if: always()
        run: docker compose --project-directory . --env-file infra/.env -f infra/compose.yaml down --volumes --remove-orphans
